[project]
name = "dameme-backend"
version = "0.1.0"
description = "Phase 1 API foundation for DaMeme"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.8",
  "ImageHash==4.3.1",
  "Pillow==11.1.0",
  "pydantic-settings==2.7.1",
  "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
  "easyocr>=1.7,<2",
  "faiss-cpu>=1.15.1",
  "httpx==0.28.1",
  "kagglehub==0.3.13",
  "pytest==8.3.4",
  "ruff==0.9.10",
  "scikit-learn>=1.6,<2",
  "torch>=2.6,<3",
  "transformers>=4.48,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
